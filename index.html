<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京冬日聖誕之旅 2026 🎄✨</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Huninn (粉圓字體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FFFCF6',
            ink: '#3E3A39',
            coral: '#F2A497',
            yamabuki: '#F6D27A',
            mizuiro: '#A8D3E6',
            wakatake: '#B9DAA5',
            softgray: '#F3EFE6'
          },
          fontFamily: {
            huninn: ['Huninn', 'cursive', 'sans-serif']
          },
          boxShadow: {
            'picture': '4px 4px 0px #3E3A39',
            'picture-sm': '2px 2px 0px #3E3A39',
            'picture-lg': '6px 6px 0px #3E3A39'
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #FFFCF6;
      color: #3E3A39;
      font-family: 'Huninn', cursive, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* 手繪風 3px 墨灰粗線邊框 */
    .picture-border {
      border: 3px solid #3E3A39;
      border-radius: 24px;
    }
    
    .picture-border-sm {
      border: 3px solid #3E3A39;
      border-radius: 16px;
    }

    .picture-btn {
      border: 3px solid #3E3A39;
      border-radius: 16px;
      box-shadow: 3px 3px 0px #3E3A39;
      transition: all 0.15s ease-out;
    }

    .picture-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #3E3A39;
    }

    /* 懸浮微動與搖晃 Keyframes */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    @keyframes bounce-tab {
      0% { transform: scale(1); }
      40% { transform: scale(1.15) translateY(-4px); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .anim-float {
      animation: float-slow 4s ease-in-out infinite;
    }

    .anim-wiggle {
      animation: wiggle 3s ease-in-out infinite;
    }

    .tab-bounce {
      animation: bounce-tab 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 支援減少動態效果 (prefers-reduced-motion) */
    @media (prefers-reduced-motion: reduce) {
      .anim-float, .anim-wiggle, .tab-bounce {
        animation: none !important;
        transition: none !important;
      }
    }

    /* 隱藏原生 Scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 自訂 Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFCF6;
    }
    ::-webkit-scrollbar-thumb {
      background: #F6D27A;
      border: 2px solid #3E3A39;
      border-radius: 8px;
    }
  </style>
</head>
<body class="pb-20">

  <!-- 頂端固定導覽列 -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-[#FFFCF6]/90 backdrop-blur-md border-b-4 border-[#3E3A39] px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="#hero" class="flex items-center gap-2 font-bold text-lg text-ink hover:opacity-80 transition">
        <svg class="w-7 h-7 anim-wiggle" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="28" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
          <path d="M18 42L32 18L46 42H18Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="32" cy="18" r="4" fill="#F6D27A" stroke="#3E3A39" stroke-width="2"/>
        </svg>
        <span>12/19 - 12/25 東京冬日聖誕之旅</span>
      </a>
      
      <!-- 導覽連結 (桌機) -->
      <div class="hidden sm:flex items-center gap-4 text-sm font-bold">
        <a href="#hero" class="hover:text-coral transition">首頁</a>
        <a href="#flights" class="hover:text-coral transition">航班資訊</a>
        <a href="#itinerary" class="hover:text-coral transition">每日行程</a>
        <a href="#hotel" class="hover:text-coral transition">住宿資訊</a>
      </div>
    </div>
  </nav>

  <!-- 主要內容區塊 -->
  <main class="max-w-4xl mx-auto pt-20 px-4 space-y-8">

    <!-- 1. Hero 區塊與出發倒數 -->
    <section id="hero" class="bg-yamabuki/20 picture-border p-6 md:p-8 relative overflow-hidden shadow-picture">
      <!-- 裝飾塗鴉點綴 -->
      <div class="absolute -right-6 -bottom-6 w-32 h-32 opacity-20 pointer-events-none">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#F2A497"/></svg>
      </div>

      <div class="flex flex-col md:flex-row items-center justify-between gap-6 relative z-10">
        <!-- 標題與簡介 -->
        <div class="text-center md:text-left space-y-3">
          <h1 class="text-3xl md:text-5xl font-black leading-tight text-ink">
            12/19 - 12/25<br>東京冬日聖誕之旅 🎄✨
          </h1>
        </div>

        <!-- 主繪本 SVG 插圖 (晴空塔 + 富士山 + 聖誕樹) -->
        <div class="w-48 h-48 relative flex-shrink-0 anim-float">
          <svg viewBox="0 0 200 200" class="w-full h-full">
            <!-- 富士山 -->
            <polygon points="20,160 80,60 140,160" fill="#A8D3E6" stroke="#3E3A39" stroke-width="4" stroke-linejoin="round"/>
            <polygon points="65,85 80,60 95,85 88,95 72,95" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
            <!-- 太陽 -->
            <circle cx="150" cy="50" r="22" fill="#F2A497" stroke="#3E3A39" stroke-width="4"/>
            <!-- 晴空塔 -->
